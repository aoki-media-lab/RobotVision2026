[project]
name = "robotvision2026"
version = "0.1.0"
description = "Robot Vision 2026 講義用ソースコード"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy==2.5.3",
    "opencv-contrib-python==5.0.0.93",
    "scikit-image>=0.26.0",
    "scikit-learn>=1.9.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# 授業共通の部品(common/)を `from common import ...` で使えるようにする
packages = ["common"]
